<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<script>document.documentElement.dataset.theme=(new URLSearchParams(location.search).get('theme')==='night')?'night':'light';</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#222;font-family:'Pretendard Variable','Pretendard',sans-serif;letter-spacing:-0.2px}

/* ---------- UI 토큰: 배치와 글자에 쓰는 색 ---------- */
/* ink/ink2 = 밝은 카드 위 글자 (두 테마 같음). fg/fg2 = 바탕 위 글자 */
:root{--ol:#3D3B52;--ink:#2E2C42;--ink2:#5B5873;--cline:#E2E1F3;--sel:#C9CCF5;--cok:#2F7A5E;--cwarn:#B5533C}
:root[data-theme="light"]{
 --bg:#F6F6FE;--surface2:#ECEDFB;--card:#FFFFFF;--panel:#E3F2FC;
 --fg:#2E2C42;--fg2:#5B5873;--line:#DCDBF0;
 --btn:#B9C3F7;--btn-fg:#2E2C42;--ok:#2F7A5E;--warn:#B5533C;
}
:root[data-theme="night"]{
 --bg:#2E3157;--surface2:#383C68;--card:#F7F6FE;--panel:#E3F2FC;
 --fg:#F2F1FF;--fg2:#C9C8EA;--line:#4D5288;
 --btn:#B9C3F7;--btn-fg:#2E2C42;--ok:#9FE0C3;--warn:#FFB7A3;
}

/* ---------- Pleos 시스템 틀 (바꾸지 않음) ---------- */
.screen{width:1600px;height:900px;background:#06090f;position:relative;overflow:hidden;color:#e8edf5;margin-bottom:20px}
.status{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.cap{background:#ffd34d;color:#1a1400;font-weight:800;font-size:19px;padding:5px 14px;border-radius:8px}
.capsub{color:#9aa4b5;font-size:16px;margin-left:12px;font-weight:500}
.clock{color:#c9d1de;font-size:17px}
.drive{position:absolute;left:16px;top:56px;width:400px;bottom:96px;background:#111722;border-radius:20px;padding:26px 30px}
.gear{font-size:22px;color:#8f9ab0}.gear b{color:#fff;font-size:26px;margin-right:6px}
.speed{font-size:104px;font-weight:300;line-height:1;margin-top:18px}.unit{font-size:20px;color:#8f9ab0}
.car{position:absolute;left:44px;right:44px;top:320px;height:150px}
.range{position:absolute;left:30px;bottom:26px;color:#8f9ab0;font-size:18px}
.dock{position:absolute;left:16px;right:16px;bottom:12px;height:72px;background:#111722;border-radius:18px;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
.dock .icons{display:flex;gap:18px}.dock .ic{width:40px;height:40px;border-radius:11px;background:#232c3c}
.dock .ic.a{background:#3b6cff}.dock .ic.b{background:#2fbf71}.dock .ic.c{background:#8b5cf6}.dock .ic.d{background:#f59e0b}
.temp{font-size:22px;color:#d6dde9}

/* ---------- 앱 영역 ---------- */
.app{position:absolute;left:432px;right:16px;top:56px;bottom:96px;border-radius:20px;overflow:hidden;background:var(--bg);color:var(--fg)}
.disp{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-0.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 26px;border-radius:16px;font-size:19px;font-weight:700;letter-spacing:-0.1px;border:2px solid var(--ol)}
.btn.p{background:var(--btn);color:var(--btn-fg)}
.btn.s{background:#FFFFFF;color:var(--ink)}
.card{background:var(--card);border:2px solid var(--ol);border-radius:16px;color:var(--ink)}
.hair{height:2px;background:var(--line);border-radius:1px}
.lab{font-size:14px;font-weight:500;color:var(--fg2)}
.val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.card .lab{color:var(--ink2)}.card .val{color:var(--ink)}
.nav{position:absolute;left:28px;display:flex;flex-direction:column;gap:10px;z-index:5}
.nav .it{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:500;color:var(--fg2);padding:7px 15px 7px 10px;border:2px solid transparent;border-radius:14px}
.nav .it.on{background:var(--sel);border-color:var(--ol);color:var(--ink);font-weight:700}
.tab{font-size:16px;font-weight:600;color:var(--fg2);padding:5px 14px;border:2px solid transparent;border-radius:999px}
.tab.on{background:var(--sel);border-color:var(--ol);color:var(--ink);font-weight:700}
.ibtn{width:44px;height:44px;border:2px solid var(--ol);border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
/* 그림: 모든 선을 화면 기준 같은 굵기로 (크기를 바꿔도 2px) */
svg.art *{vector-effect:non-scaling-stroke}
</style></head><body>

<template id="park">
  <div class="drive"><div class="gear"><b>P</b> 정차</div><div class="speed">0 <span class="unit">km/h</span></div>
  <svg class="car" viewBox="0 0 320 150"><path d="M30 105 Q32 70 80 62 L120 34 Q140 24 180 24 L225 26 Q250 30 268 62 Q300 70 298 105 Z" fill="#2a3446"/><circle cx="90" cy="108" r="22" fill="#151b26" stroke="#3a465c" stroke-width="6"/><circle cx="240" cy="108" r="22" fill="#151b26" stroke="#3a465c" stroke-width="6"/></svg>
  <div class="range">주행 가능 320 km</div></div>
</template>
<template id="dock"><div class="dock"><div class="temp">23.5°</div><div class="icons"><div class="ic a"></div><div class="ic b"></div><div class="ic"></div><div class="ic c"></div><div class="ic d"></div><div class="ic"></div><div class="ic"></div></div><div class="temp">23.5°</div></div></template>

<div class="screen" id="c1"><div class="status"><div><span class="cap">화면 1 · 도착 요약</span><span class="capsub">가로형 · 정차하면 표시</span></div><div class="clock">01:58 PM</div></div><div class="app" id="c1app"></div></div>
<div class="screen" id="c2"><div class="status"><div><span class="cap">화면 2 · 마을</span><span class="capsub">가로형 · 정차 중에만 열림</span></div><div class="clock">02:03 PM</div></div><div class="app" id="c2app"></div></div>
<div class="screen" id="c3"><div class="status"><div><span class="cap">화면 3 · 주민 도감</span><span class="capsub">가로형 · 확률과 천장을 모두 공개</span></div><div class="clock">02:05 PM</div></div><div class="app" id="c3app"></div></div>
<div class="screen" id="c4"><div class="status"><div><span class="cap">화면 4 · 세로형</span><span class="capsub">앱 창 1개 · 다른 앱과 나란히 · 가로형과 같은 기능</span></div><div class="clock">02:07 PM</div></div><div class="app" id="c4app" style="background:#06090f"></div></div>
<div class="screen" id="c5"><div class="status"><div><span class="cap">화면 5 · 주간 이웃 교류</span><span class="capsub">가로형 · 확대 계획 · 두 마을이 모두 주간 목표를 채우면 새 주민</span></div><div class="clock">02:10 PM</div></div><div class="app" id="c5app"></div></div>
<div class="screen" id="c6"><div class="status"><div><span class="cap">화면 6 · 꾸미기</span><span class="capsub">가로형 · 포인트로 아이템을 얻어 놓기</span></div><div class="clock">02:12 PM</div></div><div class="app" id="c6app"></div></div>
<div id="thumbV" style="width:520px;height:330px;position:relative;overflow:hidden;border-radius:18px;background:var(--bg)"></div>
<div id="thumbR" style="width:480px;height:250px;position:relative;display:flex;gap:40px;align-items:flex-end;justify-content:center"></div>

<script>
/* ---------------- UI 토큰 ---------------- */
const CSSV=getComputedStyle(document.documentElement),tk=n=>CSSV.getPropertyValue('--'+n).trim();
const NIGHT=document.documentElement.dataset.theme==='night';
const BG=tk('bg'),FG=tk('fg'),FG2=tk('fg2'),INK=tk('ink'),INK2=tk('ink2'),OK=tk('ok'),WARN=tk('warn'),COK=tk('cok'),BTNFG=tk('btn-fg');

/* ---------------- 그림 토큰 (두 테마에서 같음, 밤에는 하늘만 바뀜) ---------------- */
const ART={
 ol:'#3D3B52',white:'#FFFFFF',cream:'#FFF6E6',stone:'#F4F2FB',pebble:'#FFF3E6',
 peri:'#C9CCF5',lav:'#B9B3EE',baby:'#BFE3F7',mint:'#C8EBD7',mint2:'#A8DCC0',sage:'#D6F0C9',sage2:'#BFE3B4',
 pink:'#F9C9DC',butter:'#FBEAA0',peach:'#FAD3B8',rose:'#F5A6C2',blush:'#F6A5C0',trunk:'#EECBA8',
 earth:'#F6DEC9',earthD:'#ECCBB0',
 okFill:'rgba(168,220,192,.80)',okLine:'#2F7A5E',noFill:'rgba(249,188,176,.75)',noLine:'#B5533C',
 sil:'#E4E2FA',
 tint:{rain:'#DDF0FB',night:'#E6E3FA',family:'#FCE3EC',winter:'#E6F0FA',long:'#DFF3E7',charge:'#FCF2CC',mix:'#E7E8FB',locked:'#EEEDFA'}
};
const OL=ART.ol;
let LWc=2;
const O=w=>`stroke="${OL}" stroke-width="${w??LWc}" stroke-linejoin="round" stroke-linecap="round"`;
const f2=n=>+(+n).toFixed(2);

document.querySelectorAll('.screen').forEach(s=>s.insertAdjacentHTML('beforeend',document.getElementById('park').innerHTML+document.getElementById('dock').innerHTML));

const ENV={
 rain:{c:ART.tint.rain,name:'비 주민',env:'와이퍼가 동작한 운행',p:'40%',ce:'3번째',no:'01'},
 night:{c:ART.tint.night,name:'밤 주민',env:'하향등을 켜고 달린 운행',p:'30%',ce:'4번째',no:'02'},
 family:{c:ART.tint.family,name:'가족 주민',env:'뒷좌석에 사람이 탄 운행',p:'50%',ce:'2번째',no:'03'},
 winter:{c:ART.tint.winter,name:'겨울 주민',env:'성에 제거를 쓴 운행',p:'30%',ce:'4번째',no:'04'},
 long:{c:ART.tint.long,name:'장거리 주민',env:'2시간 넘는 운행에서 쉰 운행',p:'50%',ce:'2번째',no:'05'},
 charge:{c:ART.tint.charge,name:'충전 주민',env:'충전한 날 (전기차)',p:'30%',ce:'4번째',no:'06'},
 sea:{c:ART.tint.locked,name:'바다 주민',env:'바닷가 도로를 달린 운행',no:'07'},
 mountain:{c:ART.tint.locked,name:'산 주민',env:'산길을 달린 운행',no:'08'},
};

/* ---------------- 작은 그림 조각 ---------------- */
function star5(x,y,R,fill=ART.butter){let d='';for(let q=0;q<10;q++){const a=-Math.PI/2+q*Math.PI/5,r=q%2?R*.5:R;d+=(q?'L':'M')+f2(x+r*Math.cos(a))+' '+f2(y+r*Math.sin(a));}return `<path d="${d}Z" fill="${fill}" ${O()}/>`;}
function sparkle(x,y,R,fill=ART.white){const c=R*.16;return `<path d="M${f2(x)} ${f2(y-R)} Q${f2(x+c)} ${f2(y-c)} ${f2(x+R)} ${f2(y)} Q${f2(x+c)} ${f2(y+c)} ${f2(x)} ${f2(y+R)} Q${f2(x-c)} ${f2(y+c)} ${f2(x-R)} ${f2(y)} Q${f2(x-c)} ${f2(y-c)} ${f2(x)} ${f2(y-R)}Z" fill="${fill}" ${O()}/>`;}
function bub(x,y,r){return `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}" fill="#FFFFFF" ${O()}/>`;}
function cloud(x,y,k){return `<path transform="translate(${x} ${y}) scale(${k})" d="M6 0 A8 8 0 0 1 8 -14 A11 11 0 0 1 26 -24 A13 13 0 0 1 50 -26 A11 11 0 0 1 68 -16 A10.5 10.5 0 0 1 80 0 Z" fill="#FFFFFF" ${O()}/>`;}
const moonD=(cx,cy,r)=>`M${f2(cx-r)} ${f2(cy)} A${f2(r)} ${f2(r)} 0 1 0 ${f2(cx)} ${f2(cy+r)} A${f2(r*.8)} ${f2(r*.8)} 0 1 1 ${f2(cx-r)} ${f2(cy)}Z`;
function flower(x,y,R,fill=ART.white,ctr=ART.lav){const r0=R*.5,pts=[];for(let q=0;q<5;q++){const a=-Math.PI/2+Math.PI/5+q*2*Math.PI/5;pts.push([x+r0*Math.cos(a),y+r0*Math.sin(a)]);}
  const ch=2*r0*Math.sin(Math.PI/5),rl=f2(ch*.62);let d=`M${f2(pts[0][0])} ${f2(pts[0][1])}`;for(let q=1;q<=5;q++){const p=pts[q%5];d+=` A${rl} ${rl} 0 1 1 ${f2(p[0])} ${f2(p[1])}`;}
  return `<path d="${d}Z" fill="${fill}" ${O()}/><circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(R*.3)}" fill="${ctr}" ${O()}/>`;}
function leaf(x,y,len,ang,fill=ART.mint2){return `<path transform="translate(${f2(x)} ${f2(y)}) rotate(${ang})" d="M0 0 Q${f2(len*.5)} ${f2(-len*.36)} ${f2(len)} 0 Q${f2(len*.5)} ${f2(len*.36)} 0 0Z" fill="${fill}" ${O()}/>`;}
function drop(x,y,r,fill=ART.baby){return `<path d="M${f2(x)} ${f2(y-r*1.9)} C${f2(x+r*.5)} ${f2(y-r*1.1)} ${f2(x+r)} ${f2(y-r*.5)} ${f2(x+r)} ${f2(y)} A${f2(r)} ${f2(r)} 0 0 1 ${f2(x-r)} ${f2(y)} C${f2(x-r)} ${f2(y-r*.5)} ${f2(x-r*.5)} ${f2(y-r*1.1)} ${f2(x)} ${f2(y-r*1.9)}Z" fill="${fill}" ${O()}/>`;}
function heart(x,y,s,fill=ART.rose){return `<path d="M${f2(x)} ${f2(y+5*s)} C${f2(x-7*s)} ${f2(y)} ${f2(x-7*s)} ${f2(y-6*s)} ${f2(x-3*s)} ${f2(y-7*s)} C${f2(x-1*s)} ${f2(y-7.5*s)} ${f2(x)} ${f2(y-6*s)} ${f2(x)} ${f2(y-4.5*s)} C${f2(x)} ${f2(y-6*s)} ${f2(x+1*s)} ${f2(y-7.5*s)} ${f2(x+3*s)} ${f2(y-7*s)} C${f2(x+7*s)} ${f2(y-6*s)} ${f2(x+7*s)} ${f2(y)} ${f2(x)} ${f2(y+5*s)}Z" fill="${fill}" ${O()}/>`;}
const hl=(cx,cy,rx,ry,rot,op=.8)=>`<ellipse cx="${f2(cx)}" cy="${f2(cy)}" rx="${f2(rx)}" ry="${f2(ry)}" transform="rotate(${rot} ${f2(cx)} ${f2(cy)})" fill="#FFFFFF" opacity="${op}"/>`;
/* 우산 덮개: 꼭대기 (ax,ay), 폭 w, 칸마다 다른 파스텔 */
function umbrella(ax,ay,w,cols){const by=ay+w*.48,x0=ax-w/2,step=w/4,rr=f2(step*.6);let s='';
  for(let q=0;q<4;q++){const l=f2(x0+q*step),r=f2(x0+(q+1)*step);let d;
    if(q===0) d=`M${f2(ax)} ${f2(ay)} Q${f2(x0+step*.12)} ${f2(ay+w*.03)} ${l} ${f2(by)} A${rr} ${rr} 0 0 1 ${r} ${f2(by)} Z`;
    else if(q===3) d=`M${f2(ax)} ${f2(ay)} L${l} ${f2(by)} A${rr} ${rr} 0 0 1 ${r} ${f2(by)} Q${f2(x0+w-step*.12)} ${f2(ay+w*.03)} ${f2(ax)} ${f2(ay)}Z`;
    else d=`M${f2(ax)} ${f2(ay)} L${l} ${f2(by)} A${rr} ${rr} 0 0 1 ${r} ${f2(by)} Z`;
    s+=`<path d="${d}" fill="${cols[q]}" ${O()}/>`;}
  return s;}

/* ---------------- 주민: 종류마다 다른 몸 (viewBox 100) ---------------- */
function face(x,y,s=1){return `<ellipse cx="${f2(x-7*s)}" cy="${y}" rx="${f2(2.6*s)}" ry="${f2(3.2*s)}" fill="${OL}"/><ellipse cx="${f2(x+7*s)}" cy="${y}" rx="${f2(2.6*s)}" ry="${f2(3.2*s)}" fill="${OL}"/>
  <path d="M${f2(x-3*s)} ${f2(y+6*s)} Q${x} ${f2(y+9*s)} ${f2(x+3*s)} ${f2(y+6*s)}" fill="none" ${O()}/>
  <ellipse cx="${f2(x-12.5*s)}" cy="${f2(y+5*s)}" rx="${f2(4.4*s)}" ry="${f2(2.7*s)}" fill="${ART.blush}"/><ellipse cx="${f2(x+12.5*s)}" cy="${f2(y+5*s)}" rx="${f2(4.4*s)}" ry="${f2(2.7*s)}" fill="${ART.blush}"/>`;}
const DROP='M50 14 C58 30 78 44 78 64 C78 80 66 90 50 90 C34 90 22 80 22 64 C22 44 42 30 50 14Z';
const ROUND='M22 62 C22 42 35 30 50 30 C65 30 78 42 78 62 C78 79 66 90 50 90 C34 90 22 79 22 62Z';
function body(kind){
  if(kind==='rain') return `<path d="M82 33 V52 Q82 58 73 57" fill="none" ${O()}/><path d="M82 17 V11.5" fill="none" ${O()}/>
    <path d="${DROP}" fill="${ART.baby}" ${O()}/>${hl(36,55,3.6,7,28)}
    ${umbrella(82,17,32,[ART.pink,ART.butter,ART.mint2,ART.peri])}${face(50,65)}`;
  if(kind==='night') return `${star5(87,21,4.6)}<path d="${ROUND}" fill="${ART.lav}" ${O()}/>${hl(35,46,5,3,-35,.7)}
    <path d="${moonD(67,25,11)}" fill="${ART.butter}" ${O()}/>${face(50,63)}`;
  if(kind==='family') return `<path d="M12 64 C12 46 24 36 39 36 C54 36 65 46 65 64 C65 80 54 89 39 89 C24 89 12 80 12 64Z" fill="${ART.pink}" ${O()}/>${hl(25,51,4.5,2.8,-35)}${face(38,62,.9)}
    <path d="M57 73 C57 62 64 56 73 56 C82 56 89 62 89 73 C89 83 82 89 73 89 C64 89 57 83 57 73Z" fill="${ART.peach}" ${O()}/>${face(73,73,.62)}
    ${heart(65,40,.95)}`;
  if(kind==='winter') return `${sparkle(18,34,5.5,ART.baby)}${bub(84,40,2.8)}<circle cx="50" cy="60" r="28" fill="#FFFFFF" ${O()}/>
    <path d="M23.5 64 Q50 75 76.5 64 L76 72.5 Q50 83 24 72.5Z" fill="${ART.mint2}" ${O()}/><path d="M61 75 L67 91 L57.5 90 L54.5 77Z" fill="${ART.mint2}" ${O()}/>${face(50,54)}`;
  if(kind==='long') return `<rect x="21" y="47" width="17" height="28" rx="6" fill="${ART.peri}" ${O()}/><path d="M21 57 H37" fill="none" ${O()}/>
    <path d="M36 32 C36 17 64 17 64 32 L66 77 C66 89 34 89 34 77Z" fill="${ART.mint}" ${O()}/>${hl(43,28,3.4,2.2,-30)}
    <path d="M36.5 40 Q42 50 37 66" fill="none" ${O()}/>${face(52,48,.85)}`;
  if(kind==='charge') return `<path d="M54 6 L44 25 L51 25 L46 39 L61 19 L53.5 19 L58 6Z" fill="${ART.peach}" ${O()}/>
    <path d="M22 63 C22 45 35 35 50 35 C65 35 78 45 78 63 C78 79 66 90 50 90 C34 90 22 79 22 63Z" fill="${ART.butter}" ${O()}/>${hl(35,49,5,3,-35)}${face(50,64)}`;
  if(kind==='rain_moon') return `<path d="${DROP}" fill="${ART.baby}" ${O()}/>${hl(36,55,3.6,7,28)}<path d="${moonD(79,24,11)}" fill="${ART.butter}" ${O()}/>${star5(91,45,4)}${face(50,65)}`;
  return '';
}
function sil(){return `<path d="${ROUND}" fill="${ART.sil}" stroke="${OL}" stroke-width="${LWc}" stroke-dasharray="5 5" stroke-linecap="round"/><text x="50" y="71" text-anchor="middle" font-family="Jua" font-size="26" fill="${INK2}">?</text>`;}
function blob(size,kind,isSil=false,o={}){const p=LWc;LWc=o.lw||2;const g=isSil?sil():body(kind);LWc=p;
  return `<svg class="art" width="${f2(size)}" height="${f2(size)}" viewBox="0 0 100 100" style="overflow:visible;display:block">${g}</svg>`;}

/* ---------------- 선 아이콘 ---------------- */
const LI=(d,s=24,c=FG2,w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={
 home:(s,c)=>LI('<path d="M3.5 11 12 4.5l8.5 6.5"/><path d="M5.5 10v9.5h13V10"/>',s,c),
 book:(s,c)=>LI('<path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5Z"/><path d="M12 6v13.5"/>',s,c),
 chart:(s,c)=>LI('<path d="M5 20V12"/><path d="M12 20V5"/><path d="M19 20v-9"/>',s,c),
 gear:(s,c)=>LI('<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',s,c),

  for(let q=0;q<=n;q++){const x=p0[0]+(p1[0]-p0[0])*q/n,y=p0[1]+(p1[1]-p0[1])*q/n;

/* 하늘: 구름, 별, 반짝이, 방울. 밤에는 구름 대신 별, 그리고 달 */
function sky(opt){let s='';
  (opt.sky||[]).forEach(([t,x,y,z])=>{
    if(t==='cloud'){ if(NIGHT) s+=star5(x+22*z,y-16*z,6)+sparkle(x+60*z,y-6*z,7,ART.butter); else s+=cloud(x,y,z); }
    else if(t==='star') s+=star5(x,y,z);
    else if(t==='spark') s+=sparkle(x,y,z,NIGHT?ART.butter:ART.white);
    else if(t==='bub') s+=bub(x,y,z);
  });
  if(NIGHT&&opt.moon){const [x,y,r]=opt.moon;s+=`<path d="${moonD(x,y,r)}" fill="${ART.butter}" ${O()}/>`;}
  return s;}

/* 말풍선: 밝은 카드 + 같은 굵기의 선. 글꼴이 다 불러와진 뒤 폭을 다시 잰다 */
function bubble(x,y,t,o={}){const h=40,data={cx:x+(o.dx||0),by:y-(o.by??60),ax:x+(o.ax||0),ay:y-(o.ay??58),side:!!o.side,h};

  if(b.side){const my=top+h/2;d=`M${l+r} ${top} H${rr-r} A${r} ${r} 0 0 1 ${rr} ${top+r} V${by-r} A${r} ${r} 0 0 1 ${rr-r} ${by} H${l+r} A${r} ${r} 0 0 1 ${l} ${by-r} V${my+6} L${b.ax} ${b.ay} L${l} ${my-6} V${top+r} A${r} ${r} 0 0 1 ${l+r} ${top}Z`;}

  g.querySelector('path').setAttribute('d',d);});}

/* ---------------- 마을: 둥근 풀밭 섬 ---------------- */
let VID=0;const HK={'1,1':'rain','5,1':'night','1,5':'winter','6,5':'family'};
function rrPts(x0,y0,x1,y1,r,n){const pts=[];const arc=(cx,cy,a0)=>{for(let q=0;q<=n;q++){const a=(a0+90*q/n)*Math.PI/180;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}};
  arc(x1-r,y0+r,-90);arc(x1-r,y1-r,0);arc(x0+r,y1-r,90);arc(x0+r,y0+r,180);return pts;}
function resample(ch,sp){const out=[ch[0]];let carry=0;for(let q=1;q<ch.length;q++){const [x0,y0]=ch[q-1],[x1,y1]=ch[q];const L=Math.hypot(x1-x0,y1-y0);let d=sp-carry;while(d<=L){out.push([x0+(x1-x0)*d/L,y0+(y1-y0)*d/L]);d+=sp;}carry=L-(d-sp);}
  const last=ch[ch.length-1],pl=out[out.length-1];if(Math.hypot(last[0]-pl[0],last[1]-pl[1])>sp*.35)out.push(last);else out[out.length-1]=last;return out;}
const hash=(i,j,s)=>{const x=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return x-Math.floor(x);};
const DEFMAP=['g g g p g t g','t h g p g h g','g g g p g g t','f p p F p p g','g g g p g g f','g h g p g g h','t g w p t g g'];
function village(opt={}){
  const W=opt.w||1152,H=opt.h||748,N=7,TW=opt.tw||104,TH=TW/2,D=TW*.32,k=TW/104;
  const OX=opt.ox??W/2,OY=opt.oy??(H/2-N*TH/2);
  const Q=(u,v)=>[OX+(u-v)*TW/2,OY+(u+v)*TH/2],P=(i,j)=>Q(i+.5,j+.5);
  const map=(opt.map||DEFMAP).map(r=>r.split(' '));
  let s='';
  if(!opt.noBg){s+=`<rect width="${W}" height="${H}" fill="${BG}"/>`+sky(opt);}
  // 섬 윗면(둥근 사각형을 아이소로)과 흙 옆면
  const pts=rrPts(-.3,-.3,N+.3,N+.3,1.7,12).map(([u,v])=>Q(u,v));
  let iL=0,iR=0,iB=0;pts.forEach((p,q)=>{if(p[0]<pts[iL][0])iL=q;if(p[0]>pts[iR][0])iR=q;if(p[1]>pts[iB][1])iB=q;});
  const n=pts.length,walk=(a,b)=>{const r=[];for(let q=a;;q=(q+1)%n){r.push(pts[q]);if(q===b)break;}return r;};
  const front=walk(iR,iL),back=walk(iL,iR),frontR=walk(iR,iB),frontL=walk(iB,iL);
  const hw=pts[iR][0]-OX,sh=x=>D*(.7+.3*(1-Math.min(1,((x-OX)/hw)**2)));
  const band=ch=>'M'+ch.map(p=>`${f2(p[0])} ${f2(p[1])}`).join(' L')+' L'+ch.slice().reverse().map(p=>`${f2(p[0])} ${f2(p[1]+sh(p[0]))}`).join(' L')+'Z';
  s+=`<path d="${band(frontL)}" fill="${ART.earth}" ${O()}/><path d="${band(frontR)}" fill="${ART.earthD}" ${O()}/>`;
  const fr=resample(front,22*k);
  [[.2,.55,1],[.47,.6,.8],[.76,.5,1.1]].forEach(([t,dd,z])=>{const p=fr[Math.round(t*(fr.length-1))];s+=`<ellipse cx="${f2(p[0])}" cy="${f2(p[1]+sh(p[0])*dd+3*k)}" rx="${f2(5.5*k*z)}" ry="${f2(3.3*k*z)}" fill="${ART.pebble}" ${O()}/>`;});
  let gd='M'+back.map(p=>`${f2(p[0])} ${f2(p[1])}`).join(' L');const ra=f2(22*k*.62);
  for(let q=1;q<fr.length;q++){const p=fr[q];gd+=(q<2||q>fr.length-2)?` L${f2(p[0])} ${f2(p[1])}`:` A${ra} ${ra} 0 0 1 ${f2(p[0])} ${f2(p[1])}`;}
  const cid='isl'+(VID++);s+=`<clipPath id="${cid}"><path d="${gd}Z"/></clipPath><path d="${gd}Z" fill="${ART.sage}" ${O()}/>`;
  // 크림색 길 (선을 먼저, 속을 나중에 그려 교차점이 깔끔함)
  const a=P(3,0),b=P(3,6),c=P(0,3),d=P(6,3),mm=P(3,3);
  const p1=`M${f2(a[0])} ${f2(a[1])} Q${f2(mm[0]+10*k)} ${f2(mm[1]-TH)} ${f2(mm[0])} ${f2(mm[1])} T${f2(b[0])} ${f2(b[1])}`;
  const p2=`M${f2(c[0])} ${f2(c[1])} Q${f2(mm[0]-TW*.6)} ${f2(mm[1]+8*k)} ${f2(mm[0])} ${f2(mm[1])} T${f2(d[0])} ${f2(d[1])}`;
  const w1=TW*.3,w2=TW*.28,plz=opt.plaza!==false;
  s+=`<g fill="none" stroke="${OL}" stroke-linecap="round" stroke-linejoin="round"><path d="${p1}" stroke-width="${f2(w1+2*LWc)}"/><path d="${p2}" stroke-width="${f2(w2+2*LWc)}"/></g>`;
  if(plz) s+=`<ellipse cx="${f2(mm[0])}" cy="${f2(mm[1])}" rx="${f2(TW*.5+LWc)}" ry="${f2(TH*.5+LWc)}" fill="${OL}"/>`;
  s+=`<g fill="none" stroke="${ART.cream}" stroke-linecap="round" stroke-linejoin="round"><path d="${p1}" stroke-width="${f2(w1)}"/><path d="${p2}" stroke-width="${f2(w2)}"/></g>`;
  if(plz) s+=`<ellipse cx="${f2(mm[0])}" cy="${f2(mm[1])}" rx="${f2(TW*.5)}" ry="${f2(TH*.5)}" fill="${ART.cream}"/>`;
  // 연못, 디딤돌, 편집 격자
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const [x,y]=P(i,j);if(map[j][i]==='w') s+=pond(x,y,k);}
  (opt.stones||[]).forEach(([u,v])=>{const [x,y]=Q(u,v);s+=stone(x,y,k);});
  s+=`<g clip-path="url(#${cid})">`;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const [x,y]=P(i,j);
    if(opt.edit){const dia=`${f2(x)},${f2(y-TH/2)} ${f2(x+TW/2)},${f2(y)} ${f2(x)},${f2(y+TH/2)} ${f2(x-TW/2)},${f2(y)}`;s+=`<polygon points="${dia}" fill="none" stroke="${OL}" stroke-width="1.5" stroke-dasharray="3 6" opacity=".32"/>`;

function perfPath(w,h,r,sp){const seg=len=>{const n=Math.max(2,Math.round(len/sp));return [n,len/n];};let d='M0 0',n,st;
  [n,st]=seg(w);for(let q=0;q<n;q++){const c=st*(q+.5);d+=` L${f2(c-r)} 0 A${r} ${r} 0 0 0 ${f2(c+r)} 0`;}d+=` L${w} 0`;
  [n,st]=seg(h);for(let q=0;q<n;q++){const c=st*(q+.5);d+=` L${w} ${f2(c-r)} A${r} ${r} 0 0 0 ${w} ${f2(c+r)}`;}d+=` L${w} ${h}`;
  [n,st]=seg(w);for(let q=0;q<n;q++){const c=w-st*(q+.5);d+=` L${f2(c+r)} ${h} A${r} ${r} 0 0 0 ${f2(c-r)} ${h}`;}d+=` L0 ${h}`;
  [n,st]=seg(h);for(let q=0;q<n;q++){const c=h-st*(q+.5);d+=` L0 ${f2(c+r)} A${r} ${r} 0 0 0 0 ${f2(c-r)}`;}
  return d+'Z';}
